<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0B1220" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="네온 젬 머지 — 같은 보석을 합쳐 코스믹 다이아몬드까지 진화시키는 캐주얼 퍼즐 게임." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Neon Gem" />
<title>네온 젬 머지 · Neon Gem Merge</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="frame">
      <header id="hud">
        <div class="stat">
          <span class="k" data-i18n="score">점수</span>
          <span class="v" id="score">0</span>
        </div>
        <div class="stat stat-best">
          <span class="k" data-i18n="best">최고</span>
          <span class="v" id="best">0</span>
        </div>
        <div class="hud-actions">
          <button id="btn-sound" class="icon-btn" type="button" aria-label="Sound" aria-pressed="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 14V10a1 1 0 0 1 1-1h2.6l4-3.2a.8.8 0 0 1 1.3.6v11.2a.8.8 0 0 1-1.3.6l-4-3.2H5a1 1 0 0 1-1-1Z"/>
              <path class="wave" d="M16 9.2a3.6 3.6 0 0 1 0 5.6M18.4 6.8a7 7 0 0 1 0 10.4"/>
            </svg>
          </button>
          <button id="btn-pause" class="icon-btn" type="button" aria-label="Pause">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M9 6.5v11M15 6.5v11"/>
            </svg>
          </button>
        </div>
      </header>

      <div id="codex-wrap" aria-hidden="true">
        <canvas id="codex"></canvas>
      </div>

      <main id="stage">
        <canvas id="game" aria-label="Neon Gem Merge play field"></canvas>
        <div id="toast" class="toast" role="status"></div>
        <div id="sr-live" class="sr-only" aria-live="polite"></div>
      </main>

      <div id="dock">
        <button id="btn-bomb" class="booster" type="button" aria-label="Remove gem">
          <span class="booster-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="10.5" cy="13.6" r="5.6"/>
              <path d="M14.6 9.4l1.5-1.5M16.1 7.9c.5-.8.2-1.8-.6-2.3M17.8 9.6c.9-.2 1.4-1 1.3-1.9"/>
              <path d="M10.5 11.2v1.6M10.5 15.6v1.6" opacity="0.55"/>
            </svg>
          </span>
          <span class="booster-label" data-i18n="bomb">젬 제거</span>
          <span class="badge" id="bomb-count">1</span>
        </button>

        <div class="next-card" id="next-card">
          <span class="k" data-i18n="next">다음</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <button id="btn-swap" class="booster" type="button" aria-label="Swap gem">
          <span class="booster-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.6 9.4A7.6 7.6 0 0 1 18 7.2"/><path d="M18 4.4v3.1h-3.1"/>
              <path d="M19.4 14.6A7.6 7.6 0 0 1 6 16.8"/><path d="M6 19.6v-3.1h3.1"/>
            </svg>
          </span>
          <span class="booster-label" data-i18n="swap">젬 교체</span>
          <span class="badge" id="swap-count">1</span>
        </button>
      </div>

      <div id="ad-banner" aria-hidden="true">
        <div class="banner-slot"><span data-i18n="banner">광고</span></div>
      </div>

      <!-- tutorial -->
      <section id="tutorial" class="overlay overlay-dim" hidden>
        <div class="card tutorial-card" role="dialog" aria-modal="true" aria-labelledby="tut-title">
          <canvas id="tut-art" width="220" height="64" aria-hidden="true"></canvas>
          <h1 id="tut-title" data-i18n="tutorialTitle">같은 보석을 합쳐요</h1>
          <ul class="steps">
            <li><span class="dot"></span><span data-i18n="tutorial1">좌우로 움직여 보석을 떨어뜨려요.</span></li>
            <li><span class="dot"></span><span data-i18n="tutorial2">같은 보석끼리 만나면 한 단계 위로 진화해요.</span></li>
            <li><span class="dot"></span><span data-i18n="tutorial3">위험선 위에 2.5초 머무르면 게임이 끝나요.</span></li>
          </ul>
          <button id="btn-start" class="btn primary" type="button" data-i18n="start">시작하기</button>
        </div>
      </section>

      <!-- pause -->
      <section id="pause" class="overlay overlay-dim" hidden>
        <div class="card slim" role="dialog" aria-modal="true" aria-labelledby="pause-title">
          <h2 id="pause-title" data-i18n="pause">일시정지</h2>
          <div class="row">
            <button id="btn-resume" class="btn primary" type="button" data-i18n="resume">계속하기</button>
            <button id="btn-restart" class="btn ghost" type="button" data-i18n="restart">다시 시작</button>
          </div>
        </div>
      </section>

      <!-- game over -->
      <section id="over" class="overlay overlay-sheet" hidden>
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="over-eyebrow">
          <span class="handle" aria-hidden="true"></span>
          <p class="eyebrow" id="over-eyebrow" data-i18n="gameOver">게임 오버</p>
          <h2 id="final-score" class="big-score">0</h2>
          <p class="sub" id="over-sub" data-i18n="overMsg">보석이 위험선을 넘었어요</p>
          <p class="record" id="record-pill" hidden data-i18n="newRecord">새 최고 기록!</p>
          <div class="best-line"><span data-i18n="best">최고</span><b id="final-best">0</b></div>
          <button id="btn-revive" class="btn reward" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5.5" width="18" height="12" rx="2.6"/><path d="M10.4 9.6l4.2 2.4-4.2 2.4z" fill="currentColor" stroke="none"/><path d="M8 20.5h8"/>
            </svg>
            <span data-i18n="revive">광고 보고 부활</span>
            <em data-i18n="reviveNote">한 판에 한 번</em>
          </button>
          <button id="btn-again" class="btn primary" type="button" data-i18n="retry">다시 도전</button>
        </div>
      </section>

      <!-- simulated ad (web only) -->
      <section id="ad" class="overlay overlay-dim ad-overlay" hidden>
        <div class="card ad-card" role="dialog" aria-modal="true">
          <div class="ad-head">
            <span class="ad-tag" data-i18n="adTag">광고</span>
            <span class="ad-demo" id="ad-demo">simulated</span>
          </div>
          <div class="ad-visual" aria-hidden="true"><span class="ad-orb"></span></div>
          <p class="ad-title" id="ad-title" data-i18n="adPlaying">광고를 보는 중이에요</p>
          <div class="bar"><i id="ad-bar"></i></div>
          <button id="btn-claim" class="btn primary" type="button" disabled data-i18n="adReward">보상 받기</button>
          <button id="btn-ad-close" class="link-btn" type="button" data-i18n="adSkip" hidden>닫기</button>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
